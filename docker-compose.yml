version: '3.8'

services:
  # Redis for queue management
  redis:
    image: redis:7.2-alpine
    container_name: lettuce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass lettuce_disease_redis_2024
    networks:
      - lettuce_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend inference server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lettuce_backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://:lettuce_disease_redis_2024@redis:6379
      - CUDA_VISIBLE_DEVICES=0
      - LOG_LEVEL=info
    volumes:
      - ./lettuce_ssl_segmentation_lab:/app/lettuce_ssl_segmentation_lab:ro
      - ./backend:/app/backend
      - inference_output:/app/inference_output
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lettuce_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend web server
  frontend:
    image: nginx:alpine
    container_name: lettuce_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - lettuce_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
  inference_output:

networks:
  lettuce_network:
    driver: bridge
